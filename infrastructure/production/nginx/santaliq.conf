# Installed on the VPS at /home/ubuntu/docker/proxy/data/nginx/custom/sites/santaliq.conf
# Certificate: host certbot (webroot /home/ubuntu/docker/proxy/acme), mounted at /etc/letsencrypt-host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name santaliq.supersoftltd.com;

    ssl_certificate /etc/letsencrypt-host/live/santaliq.supersoftltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-host/live/santaliq.supersoftltd.com/privkey.pem;
    include /etc/letsencrypt-host/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt-host/ssl-dhparams.pem;

    client_max_body_size 10M;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    # Report-only while tuning: violations go to /admin/system (Errors, source "Security policy").
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/v1/telemetry/csp" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://santaliq-web:3000;
    set $api http://santaliq-api:8000;

    location /_next/static/ {
        proxy_pass $web;
        include /data/nginx/custom/snippets/proxy.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass $api;
        include /data/nginx/custom/snippets/proxy.conf;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $web;
        include /data/nginx/custom/snippets/proxy.conf;
    }
}
