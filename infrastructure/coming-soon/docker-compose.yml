# SANTALIQ temporary "coming soon" page.
# Server path: /home/ubuntu/docker/websites/santaliq/
# Nginx Proxy Manager: santaliq.supersoftltd.com -> http://santaliq-web:80 (+ SSL)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: nginx:1.27-alpine
    container_name: santaliq-web
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
