# Local development services. Start: docker compose up -d   Stop: docker compose down
# WARNING: "docker compose down -v" deletes the database volume and all its data.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: santaliq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santaliq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-santaliq}
      POSTGRES_DB: ${POSTGRES_DB:-santaliq}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - santaliq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santaliq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: santaliq-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  santaliq_pgdata:
